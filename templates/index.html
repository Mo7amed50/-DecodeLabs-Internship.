<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DecodeLabs Rule-Based Bot</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f1f5f9; }
      .container { max-width: 780px; margin: 0 auto; padding: 24px; }
      .header { text-align: center; margin-bottom: 18px; }
      .header h1 { margin-bottom: 8px; font-size: 28px; }
      .header p { color: #444; }
      .chat-box { background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 20px; min-height: 380px; overflow-y: auto; }
      .message { margin-bottom: 16px; }
      .message strong { display: block; margin-bottom: 4px; }
      .message.user { text-align: right; }
      .message.user .bubble { display: inline-block; background: #38bdf8; color: #fff; padding: 12px 16px; border-radius: 18px 18px 0 18px; max-width: 75%; }
      .message.bot .bubble { display: inline-block; background: #e2e8f0; color: #111827; padding: 12px 16px; border-radius: 18px 18px 18px 0; max-width: 75%; }
      .controls { margin-top: 18px; display: flex; gap: 8px; }
      .controls input[type="text"] { flex: 1; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
      .controls button { padding: 12px 18px; border: none; background: #0ea5e9; color: white; border-radius: 10px; cursor: pointer; font-size: 14px; }
      .controls button:disabled { background: #94a3b8; cursor: not-allowed; }
      .footer { text-align: center; margin-top: 12px; color: #667085; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>DecodeLabs Rule-Based Bot</h1>
        <p>Flask UI for Project 1 — Type a message and chat with the bot.</p>
      </div>
      <div id="chat" class="chat-box"></div>
      <div class="controls">
        <input id="message" type="text" placeholder="Type your message..." autocomplete="off" />
        <button id="send">Send</button>
      </div>
      <div class="footer">Powered by Flask + rule-based response logic in `responses.py`.</div>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const messageInput = document.getElementById('message');
      const sendButton = document.getElementById('send');

      function appendMessage(role, text) {
        const message = document.createElement('div');
        message.className = 'message ' + role;
        message.innerHTML = `<strong>${role === 'user' ? 'You' : 'Bot'}</strong><div class="bubble"></div>`;
        message.querySelector('.bubble').textContent = text;
        chat.appendChild(message);
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) {
          appendMessage('bot', "Please type something, or 'bye' to exit.");
          messageInput.value = '';
          return;
        }

        appendMessage('user', text);
        messageInput.value = '';

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });

        const data = await response.json();
        appendMessage('bot', data.reply);

        if (data.exit) {
          messageInput.disabled = true;
          sendButton.disabled = true;
        }
      }

      sendButton.addEventListener('click', sendMessage);
      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendMessage();
        }
      });

      appendMessage('bot', {{ welcome | tojson | safe }});
      messageInput.focus();
    </script>
  </body>
</html>
